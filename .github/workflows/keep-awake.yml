
name: Keep Render Portal Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ECE Portal
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            https://ece-portal-v75g.onrender.com/api/health

